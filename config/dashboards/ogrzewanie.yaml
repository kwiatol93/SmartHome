title: Ogrzewanie
views:
  - title: Ogrzewanie
    path: ogrzewanie
    icon: mdi:radiator
    cards:
      - type: markdown
        content: >-
          Tryb obserwacji: moduł pokazuje swoje decyzje, ale nie steruje jeszcze
          zaworami, pompą ani piecem.

      - type: entities
        title: Tryb i harmonogram
        show_header_toggle: false
        entities:
          - entity: input_select.heating_home_mode
            name: Tryb domu
          - entity: sensor.ogrzewanie_aktywny_profil
            name: Aktywny profil
          - entity: input_boolean.heating_free_day_forced
            name: Wymuszony dzień wolny — status
          - entity: input_select.heating_free_day_duration
            name: Czas wymuszenia
          - entity: input_datetime.heating_free_day_until
            name: Wymuszenie do
          - entity: input_button.heating_start_free_day
            name: Wymuś dzień wolny
          - entity: input_button.heating_cancel_free_day
            name: Anuluj wymuszenie

      - type: entities
        title: Logiczne wyjścia — co nowy system chce teraz grzać
        show_header_toggle: false
        entities:
          - {entity: sensor.ogrzewanie_decyzja_strefa_dzienna, name: Strefa dzienna}
          - {entity: sensor.ogrzewanie_decyzja_lazienka, name: Łazienka}
          - {entity: sensor.ogrzewanie_decyzja_korytarz, name: Korytarz}
          - {entity: sensor.ogrzewanie_decyzja_wc, name: WC}
          - {entity: sensor.ogrzewanie_decyzja_wiatrolap, name: Wiatrołap}
          - {entity: sensor.ogrzewanie_decyzja_biuro, name: Biuro}
          - {entity: sensor.ogrzewanie_decyzja_pokoj_hani, name: Pokój Hani}
          - {entity: sensor.ogrzewanie_decyzja_sypialnia, name: Sypialnia}
          - {entity: sensor.ogrzewanie_decyzja_poddasze, name: Poddasze}

      - type: grid
        title: Setpointy stref
        columns: 2
        square: false
        cards:
          - {type: tile, entity: input_number.heating_setpoint_living, name: Strefa dzienna, features_position: bottom, features: [{type: numeric-input, style: slider}]}
          - {type: tile, entity: input_number.heating_setpoint_bathroom, name: Łazienka — baza, features_position: bottom, features: [{type: numeric-input, style: slider}]}
          - {type: tile, entity: input_number.heating_setpoint_corridor, name: Korytarz, features_position: bottom, features: [{type: numeric-input, style: slider}]}
          - {type: tile, entity: input_number.heating_setpoint_wc, name: WC — minimum, features_position: bottom, features: [{type: numeric-input, style: slider}]}
          - {type: tile, entity: input_number.heating_setpoint_wind_lobby, name: Wiatrołap — minimum, features_position: bottom, features: [{type: numeric-input, style: slider}]}
          - {type: tile, entity: input_number.heating_setpoint_office, name: Biuro, features_position: bottom, features: [{type: numeric-input, style: slider}]}
          - {type: tile, entity: input_number.heating_setpoint_hania, name: Pokój Hani, features_position: bottom, features: [{type: numeric-input, style: slider}]}
          - {type: tile, entity: input_number.heating_setpoint_bedroom, name: Sypialnia, features_position: bottom, features: [{type: numeric-input, style: slider}]}
          - {type: tile, entity: input_number.heating_setpoint_attic, name: Poddasze, features_position: bottom, features: [{type: numeric-input, style: slider}]}

      - type: entities
        title: Strefa dzienna — salon, kuchnia i jadalnia
        show_header_toggle: false
        entities:
          - {entity: sensor.ogrzewanie_temperatura_strefa_dzienna, name: Temperatura}
          - {entity: sensor.ogrzewanie_domyslny_setpoint_strefa_dzienna, name: Domyślny setpoint profilu}
          - {entity: sensor.ogrzewanie_decyzja_strefa_dzienna, name: Decyzja braina}

      - type: entities
        title: Łazienka i korytarz
        show_header_toggle: false
        entities:
          - {entity: sensor.ogrzewanie_temperatura_lazienka, name: Łazienka — temperatura}
          - {entity: sensor.ogrzewanie_efektywny_setpoint_lazienki, name: Łazienka — setpoint efektywny}
          - {entity: sensor.ogrzewanie_decyzja_lazienka, name: Łazienka — decyzja braina}
          - {entity: input_select.heating_bathroom_boost_duration, name: Czas dogrzewania}
          - {entity: input_button.heating_start_bathroom_boost, name: Uruchom dogrzewanie}
          - {entity: timer.heating_bathroom_boost, name: Pozostały czas dogrzewania}
          - {entity: sensor.ogrzewanie_temperatura_korytarz, name: Korytarz — temperatura}
          - {entity: sensor.ogrzewanie_decyzja_korytarz, name: Korytarz — decyzja braina}

      - type: entities
        title: Pozostałe strefy
        show_header_toggle: false
        entities:
          - {entity: sensor.ogrzewanie_temperatura_wc, name: WC — temperatura}
          - {entity: sensor.ogrzewanie_decyzja_wc, name: WC — decyzja braina}
          - {entity: sensor.ogrzewanie_temperatura_wiatrolap, name: Wiatrołap — temperatura}
          - {entity: sensor.ogrzewanie_decyzja_wiatrolap, name: Wiatrołap — decyzja braina}
          - {entity: sensor.ogrzewanie_temperatura_biuro, name: Biuro — temperatura}
          - {entity: sensor.ogrzewanie_decyzja_biuro, name: Biuro — decyzja braina}
          - {entity: sensor.ogrzewanie_temperatura_pokoj_hani, name: Pokój Hani — temperatura}
          - {entity: sensor.ogrzewanie_decyzja_pokoj_hani, name: Pokój Hani — decyzja braina}
          - {entity: sensor.ogrzewanie_temperatura_sypialnia, name: Sypialnia — temperatura}
          - {entity: sensor.ogrzewanie_decyzja_sypialnia, name: Sypialnia — decyzja braina}
          - {entity: sensor.ogrzewanie_temperatura_poddasze, name: Poddasze — temperatura}
          - {entity: sensor.ogrzewanie_decyzja_poddasze, name: Poddasze — decyzja braina}

      - type: entities
        title: Bezpieczniki i reset
        show_header_toggle: false
        entities:
          - {entity: input_boolean.heating_shadow_mode, name: Tryb obserwacji}
          - {entity: input_boolean.heating_automation_active, name: Automatyka ogrzewania aktywna}
          - {entity: input_button.heating_reset_all_setpoints, name: Resetuj wszystkie setpointy do profilu}
          - {entity: input_button.heating_emergency_off, name: Awaryjnie wyłącz ogrzewanie}

