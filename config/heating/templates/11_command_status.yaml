# Czytelna prezentacja decyzji braina dla dashboardu. Encje binary_sensor
# pozostają technicznym źródłem prawdy; te sensory nie sugerują, że sprzęt
# fizycznie już grzeje.
- sensor:
    - name: Ogrzewanie — decyzja strefa dzienna
      unique_id: heating_decision_living
      icon: >-
        {{ 'mdi:radiator' if is_state('binary_sensor.ogrzewanie_zapotrzebowanie_strefa_dzienna', 'on') else 'mdi:radiator-disabled' }}
      state: >-
        {{ 'Grzać' if is_state('binary_sensor.ogrzewanie_zapotrzebowanie_strefa_dzienna', 'on') else 'Nie grzać' }}
